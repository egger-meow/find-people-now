name: Supabase DB Tests

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'

jobs:
  db-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start local DB and apply migrations
        run: supabase db start

      - name: Run pgTAP tests
        run: supabase test db

      - name: Stop local DB
        if: always()
        run: supabase stop
